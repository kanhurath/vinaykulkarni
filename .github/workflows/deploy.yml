name: Deploy to BigRock

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-bigrock
  cancel-in-progress: false

env:
  SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
  # DEPLOY_PATH secret MUST be the web root:
  #   /home/vinayroot/web/vinaykulkarni.com/public_html
  DP: ${{ secrets.DEPLOY_PATH }}
  PM2_APP: vk-cms-server
  SITE_URL: https://vinaykulkarni.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (Vite)
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run build
          test -f dist/index.html
          test -d dist/assets
          test "$(find dist/assets -type f | wc -l)" -gt 0

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Snapshot current release
        run: |
          ssh "$SSH_TARGET" DP="$DP" 'bash -s' <<'EOF'
          set -euo pipefail
          mkdir -p "$DP/server"
          rm -rf "$DP/.rollback"; mkdir -p "$DP/.rollback"
          [ -d "$DP/server" ]     && cp -al "$DP/server"     "$DP/.rollback/server"     || true
          [ -d "$DP/assets" ]     && cp -al "$DP/assets"     "$DP/.rollback/assets"     || true
          [ -f "$DP/index.html" ] && cp -p  "$DP/index.html" "$DP/.rollback/index.html" || true
          echo "snapshot done"
          EOF

      - name: Sync backend (server/)
        run: |
          rsync -rlptz --delete --no-owner --no-group \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='public/uploads/' \
            --exclude='.git/' \
            server/ "$SSH_TARGET:$DP/server/"

      - name: Sync frontend build
        run: |
          rsync -rlptz --delete --no-owner --no-group \
            frontend/dist/assets/ "$SSH_TARGET:$DP/assets/"
          rsync -rlptz --no-owner --no-group \
            --exclude='assets/' \
            frontend/dist/ "$SSH_TARGET:$DP/"

      - name: Write server .env from secret
        env:
          SERVER_ENV_FILE: ${{ secrets.SERVER_ENV_FILE }}
        run: |
          if [ -z "${SERVER_ENV_FILE:-}" ]; then
            echo "SERVER_ENV_FILE not set — leaving existing server/.env untouched."
            exit 0
          fi
          printf '%s\n' "$SERVER_ENV_FILE" | \
            ssh "$SSH_TARGET" "umask 027 && cat > '$DP/server/.env'"

      - name: Release
        run: |
          ssh "$SSH_TARGET" DP="$DP" APP="$PM2_APP" SITE_URL="$SITE_URL" 'bash -s' <<'EOF'
          set -uo pipefail
          cd "$DP/server"

          rollback() {
            echo "::error::ROLLBACK — $1"
            [ -d "$DP/.rollback/server" ] && { rm -rf "$DP/server"; mv "$DP/.rollback/server" "$DP/server"; }
            [ -d "$DP/.rollback/assets" ] && { rm -rf "$DP/assets"; mv "$DP/.rollback/assets" "$DP/assets"; }
            [ -f "$DP/.rollback/index.html" ] && cp -p "$DP/.rollback/index.html" "$DP/index.html"
            chown -R vinayroot:vinayroot "$DP/server" "$DP/assets" "$DP/index.html" 2>/dev/null || true
            pm2 restart "$APP" --update-env 2>/dev/null \
              || pm2 start "$DP/server/index.js" --name "$APP" --cwd "$DP/server"
            pm2 save; rm -rf "$DP/.rollback"; exit 1
          }

          npm ci --omit=dev --prefer-offline --no-audit --no-fund || rollback "npm ci failed"
          node --check index.js          || rollback "index.js syntax error"
          node --check seoHtmlBuilder.js || rollback "seoHtmlBuilder.js syntax error"

          chown vinayroot:www-data "$DP"; chmod 755 "$DP"
          find "$DP" -maxdepth 1 -mindepth 1 ! -name blog ! -name '.rollback' \
            -exec chown -R vinayroot:vinayroot {} +

          if pm2 describe "$APP" >/dev/null 2>&1; then
            pm2 restart "$APP" --update-env || rollback "pm2 restart failed"
          else
            pm2 start index.js --name "$APP" --cwd "$DP/server" || rollback "pm2 start failed"
          fi

          sleep 5
          api=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/health)
          page=$(curl -s -o /tmp/vk_home.html -w '%{http_code}' "$SITE_URL/")
          echo "health: api=$api page=$page"
          [ "$api" = "200" ]  || rollback "API health $api"
          [ "$page" = "200" ] || rollback "page health $page"
          grep -q 'id="root"'                /tmp/vk_home.html || rollback "home page missing SPA root"
          grep -qE '/assets/index-[^"]+\.js' /tmp/vk_home.html || rollback "home page missing JS bundle"

          pm2 save; rm -rf "$DP/.rollback"
          echo "deploy OK (api=$api page=$page)"
          EOF

      - name: Done
        run: echo "Deployed to ${{ secrets.SSH_HOST }}"